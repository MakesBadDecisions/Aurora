#####################################################################
##                    Aurora Lights - Main Configuration
##
##  Modular LED effects system for Klipper 3D printers.
##  
##  Include this single file in your printer.cfg:
##    [include Aurora.cfg]
##
##  IMPORTANT: Add AURORA_WAKE to your macros!
##    AURORA_WAKE goes BEFORE blocking code (G28, M109, M190, etc.)
##    The dispatcher dies during blocking - WAKE catches state first.
##
##    PRINT_START:
##      M140 S{bed_temp}    # Start heating (non-blocking)
##      AURORA_WAKE         # ← Detect heating NOW before G28 blocks
##      G28                 # Blocking - dispatcher dead during this
##      ...
##      AURORA_WAKE         # ← Restart after all blocking done
##
##    PRINT_END / CANCEL_PRINT:
##      TURN_OFF_HEATERS
##      AURORA_WAKE         # ← Detect cooldown
##
##  Design Philosophy:
##    - Performance is ALWAYS priority over RGB effects
##    - KISS: Simple, predictable, maintainable
##    - Must work on resource-constrained hosts (Pi Zero 2W, etc.)
##
##  File Structure:
##    Aurora.cfg (this file) - User configuration
##    Aurora/
##      core/     - System internals (don't touch)
##      effects/  - Effect primitives (pulse, heartbeat, etc.)
#####################################################################

# Load all Aurora modules
[include ./Aurora/includes.cfg]

#####################################################################
##                                                                 ##
##                    HARDWARE DEFINITIONS                         ##
##                    (Klipper neopixel sections)                  ##
##                                                                 ##
#####################################################################

[neopixel toolhead_leds]
pin: EBBCan:PD3
chain_count: 3
color_order: GRB 
initial_RED: 0.0
initial_GREEN: 1.0
initial_BLUE: 0.0
# LED Map:
#   INDEX 1 : Status Emblem
#   INDEX 2 : Nozzle Light  
#   INDEX 3 : Nozzle Light

[neopixel chamber_lights]
pin: PD15
chain_count: 36  
color_order: GRB
initial_RED: 0.8
initial_GREEN: 0.8
initial_BLUE: 0.8
# LED Map:
#   INDEX 1-18  : Right strip
#   INDEX 19-36 : Left strip

#####################################################################
##                                                                 ##
##                    EFFECT SETTINGS                              ##
##                    (Tune how effects behave)                    ##
##                                                                 ##
#####################################################################

[gcode_macro _AURORA_EFFECT_PULSE]
variable_speed: 3              # Wave cycles per second (3 = quick pulse, 0.5 = slow breathe)
variable_min_brightness: 0.3   # Dimmest point (0.0-1.0)
variable_max_brightness: 0.6   # Brightest point (0.0-1.0)
variable_color: "vaporwave"         # Color name from _AURORA_COLORS (default)
gcode:

[gcode_macro _AURORA_EFFECT_HEARTBEAT]
variable_beat_speed: 1.0       # Heartbeats per second (1.0 = 60 BPM)
variable_min_brightness: 0.0   # Dimmest point (0.0-1.0)
variable_max_brightness: 0.8   # Brightest point (0.0-1.0)
variable_color: "blood"          # Color name from _AURORA_COLORS
gcode:

[gcode_macro _AURORA_EFFECT_KIT]
variable_speed: 0.5            # Sweeps per second (0.5 = 2 sec full sweep)
variable_tail_length: 5        # LEDs in the trail
variable_brightness: 0.8       # Max brightness (0.0-1.0)
variable_color: "orange"       # Color name from _AURORA_COLORS
gcode:


[gcode_macro _AURORA_EFFECT_DISCO]
variable_change_rate: 0.5     # Seconds between sparkle updates (faster = more chaos)
variable_min_sparkle: 5        # Minimum LEDs to light per tick
variable_max_sparkle: 20        # Maximum LEDs to light per tick
variable_brightness: 0.8       # Max brightness cap (0.0-1.0)
gcode:

[gcode_macro _AURORA_EFFECT_THERMAL]
variable_cold_color: "ice"    # Color for unlit/background LEDs
variable_hot_color: "lava"   # Color for lit LEDs (progress fill)
variable_brightness: 0.8       # Max brightness (0.0-1.0)
variable_heater: "max"         # Which heater: "bed", "extruder", or "max" (auto)
gcode:

[gcode_macro _AURORA_EFFECT_PROGRESS]
variable_start_color: "steel"   # Color at 0% (first LED)
variable_end_color: "matrix"      # Color at 100% (last LED)
variable_background: "off"       # Unlit LEDs: color name or "off"
variable_gradient: 1             # 1 = gradient per LED, 0 = solid end_color
gcode:

# NOTE: Pong effect (future) - uses paired strips on same neopixel chain
#       B1 (left_strip) + B2 (right_strip) would work together
#       Effect follows print head X position

#####################################################################
##                                                                 ##
##                    GLOBAL SETTINGS                              ##
##                                                                 ##
#####################################################################

[gcode_macro _AURORA_SETTINGS]
variable_debug: 1                   # 1 = Show debug messages, 0 = silent
variable_max_brightness: 0.3        # Global brightness cap (0.0-1.0) - lower to reduce power draw
variable_update_rate: 0.1           # Seconds between updates (idle/heating)
variable_update_rate_printing: 1    # Slower during prints (CPU safety)
variable_bored_timeout: 300         # Seconds idle before "bored" event (5 min)
variable_sleep_timeout: 300         # Seconds in bored before "sleep" (5 min)
variable_temp_floor: 25             # Ambient temp baseline (°C)
# RGBW Settings (for strips with white channel like SK6812 RGBW)
variable_use_white_channel: 1       # 1 = Auto-use W on RGBW strips, 0 = RGB only
variable_white_mix: 1.0             # How much white to blend in (0.0-1.0)
gcode:

#####################################################################
##                                                                 ##
##                    GROUP CONFIGURATION                          ##
##                                                                 ##
##  Main Groups: A, B, C, D (physical neopixel chains)             ##
##  Sub-Groups: A1, A2 / B1, B2 (LED index ranges within chain)    ##
##                                                                 ##
##  Events (auto-detected by dispatcher):                          ##
##    idle     - Printer idle, motors off                          ##
##    error    - Klipper error/shutdown state                      ##
##    heating  - Heaters on, waiting for temperature               ##
##    printing - Active print job                                  ##
##    cooldown - Heaters off, still hot                            ##
##    bored    - Idle timer expired (party time!)                  ##
##    sleep    - Bored too long (LEDs off, save power)             ##
##    cancelled - Print was cancelled                              ##
##    complete  - Print finished successfully                      ##
##                                                                 ##
##  Set effect name OR color name for each event                   ##
##  Color names (red, green, blue, etc.) = solid color             ##
##  Effect names (pulse, heartbeat, etc.) = animated effect        ##
##  "off" = LEDs off for that event                                ##
##                                                                 ##
#####################################################################

[gcode_macro _AURORA_GROUPS]
description: Aurora Lights group and sub-group configuration

#====================================================================
#                       MAIN GROUP A - Toolhead
#====================================================================
variable_group_a_neopixel: "toolhead_leds"  # Name of [neopixel] section
variable_group_a_enabled: 1                  # 1 = active, 0 = disabled

#---------- Sub-Group A1: Emblem ----------
variable_group_a1_start: 1                   # First LED index (1-based)
variable_group_a1_end: 1                     # Last LED index (inclusive)
variable_group_a1_name: "emblem"             # Friendly name for debug
# Event → Effect or Color
variable_group_a1_on_idle: "sky"
variable_group_a1_on_error: "red"
variable_group_a1_on_heating: "pulse"
variable_group_a1_on_printing: "cobalt"
variable_group_a1_on_cooldown: "ice"
variable_group_a1_on_bored: "disco"
variable_group_a1_on_sleep: "off"

#---------- Sub-Group A2: Work Lights ----------
variable_group_a2_start: 2
variable_group_a2_end: 3
variable_group_a2_name: "worklights"
# Event → Effect or Color
variable_group_a2_on_idle: "off"
variable_group_a2_on_error: "red"
variable_group_a2_on_heating: "lava"
variable_group_a2_on_printing: "white"
variable_group_a2_on_cooldown: "off"
variable_group_a2_on_bored: "disco"
variable_group_a2_on_sleep: "off"

#====================================================================
#                       MAIN GROUP B - Chamber
#====================================================================
variable_group_b_neopixel: "chamber_lights"
variable_group_b_enabled: 1

#---------- Sub-Group B1: Left Strip ----------
variable_group_b1_start: 1
variable_group_b1_end: 18
variable_group_b1_name: "left_strip"
# Event → Effect or Color
variable_group_b1_on_idle: "steel"
variable_group_b1_on_error: "red"
variable_group_b1_on_heating: "orange"
variable_group_b1_on_printing: "progress"
variable_group_b1_on_cooldown: "ice"
variable_group_b1_on_bored: "disco"
variable_group_b1_on_sleep: "off"

#---------- Sub-Group B2: Right Strip ----------
variable_group_b2_start: 19
variable_group_b2_end: 36
variable_group_b2_name: "right_strip"
# Event → Effect or Color
variable_group_b2_on_idle: "steel"
variable_group_b2_on_error: "red"
variable_group_b2_on_heating: "orange"
variable_group_b2_on_printing: "electric"
variable_group_b2_on_cooldown: "ice"
variable_group_b2_on_bored: "disco"
variable_group_b2_on_sleep: "off"

gcode:

