#####################################################################
##                    Aurora Lights - State Management
##
##  Runtime state variables for Aurora system.
##  Tracks current event, active effects, and system state.
#####################################################################

[gcode_macro _AURORA_STATE]
description: Aurora runtime state variables

# ----- Current State -----
variable_current_event: "idle"       # Current active event
variable_previous_event: "none"      # Last event (for transition detection)
variable_system_active: True         # Master enable/disable

# ----- Timing -----
variable_last_update: 0              # Last update timestamp
variable_idle_ticks: 0               # Tick counter for bored timer (reset on non-idle events)
variable_bored_ticks: 0              # Tick counter for sleep timer (counts while in bored)

# ----- Effect State -----
variable_effects_running: False      # Are effects currently animating

gcode:
    # State storage only

#####################################################################
##                    Boot Initialization
#####################################################################

[delayed_gcode _AURORA_BOOT]
initial_duration: 2.0
gcode:
    {% set debug = printer["gcode_macro _AURORA_SETTINGS"].debug %}
    
    {% if debug %}
    RESPOND MSG="[AURORA] ========================================" 
    RESPOND MSG="[AURORA] Aurora Lights initializing..."
    RESPOND MSG="[AURORA] ========================================"
    {% endif %}
    
    # Initialize state
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=previous_event VALUE='"none"'
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=idle_ticks VALUE=0
    
    # Detect initial state and force trigger it
    {% set bed_temp = printer.heater_bed.temperature %}
    {% set bed_target = printer.heater_bed.target %}
    {% set nozzle_temp = printer.extruder.temperature %}
    {% set nozzle_target = printer.extruder.target %}
    {% set temp_floor = printer["gcode_macro _AURORA_SETTINGS"].temp_floor %}
    
    {% set initial_event = "idle" %}
    {% if printer.webhooks.state == "shutdown" or printer.webhooks.state == "error" %}
        {% set initial_event = "error" %}
    {% elif bed_target > 0 or nozzle_target > 0 %}
        {% set initial_event = "heating" %}
    {% elif bed_temp > (temp_floor + 10) or nozzle_temp > (temp_floor + 30) %}
        {% set initial_event = "cooldown" %}
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=current_event VALUE='"{initial_event}"'
    
    {% if debug %}
    RESPOND MSG="[AURORA] Initial state: {initial_event}"
    {% endif %}
    
    # Force trigger initial event to set LEDs
    _AURORA_HANDLE_EVENT EVENT={initial_event}
    
    # Start the dispatcher loop
    UPDATE_DELAYED_GCODE ID=_AURORA_DISPATCHER DURATION=1.0
    
    {% if debug %}
    RESPOND MSG="[AURORA] Boot complete, dispatcher started"
    {% endif %}
