#####################################################################
##                    Aurora Lights - Dispatcher
##
##  THE BRAIN: Monitors printer state and triggers appropriate events.
##  
##  Flow:
##    1. Poll Klipper state
##    2. Determine current event (idle/heating/printing/etc)
##    3. If event changed → call event handler
##    4. Event handler looks up effect per group and runs it
##    5. Reschedule self
#####################################################################

[delayed_gcode _AURORA_DISPATCHER]
gcode:
    {% set state = printer["gcode_macro _AURORA_STATE"] %}
    {% set settings = printer["gcode_macro _AURORA_SETTINGS"] %}
    {% set debug = settings.debug %}
    
    # ALWAYS reschedule FIRST - ensures loop survives Klipper blocking
    # (like during PRINT_START homing/probing sequences)
    {% set print_state = printer.print_stats.state|default("standby") %}
    {% if print_state == "printing" or print_state == "paused" %}
        UPDATE_DELAYED_GCODE ID=_AURORA_DISPATCHER DURATION={settings.update_rate_printing}
    {% else %}
        UPDATE_DELAYED_GCODE ID=_AURORA_DISPATCHER DURATION={settings.update_rate}
    {% endif %}
    
    # Only run if system is active
    {% if state.system_active %}
        
        # ----- DETERMINE CURRENT EVENT -----
        # Use print_stats.state (from virtual_sdcard) - what Mainsail/KlipperScreen use
        # States: "standby", "printing", "paused", "complete", "cancelled", "error"
        {% set print_state = printer.print_stats.state %}
        {% set bed_temp = printer.heater_bed.temperature %}
        {% set bed_target = printer.heater_bed.target %}
        {% set nozzle_temp = printer.extruder.temperature %}
        {% set nozzle_target = printer.extruder.target %}
        {% set temp_floor = settings.temp_floor %}
        {% set now = printer.system_stats.cputime %}
        {% set current = state.current_event %}
        
        # Default to idle
        {% set new_event = "idle" %}
        
        # Check for error state first (highest priority)
        {% if printer.webhooks.state == "shutdown" or printer.webhooks.state == "error" or print_state == "error" %}
            {% set new_event = "error" %}
        
        # Check if printing or paused (actual print job active)
        # Note: "complete" and "cancelled" states fall through to cooldown check below
        {% elif print_state == "printing" or print_state == "paused" %}
            # Progress < 1% = still in PRINT_START phase (homing, probing, heating)
            {% set progress = printer.print_stats.progress %}
            {% if progress < 0.01 %}
                # Early startup phase - always show heating
                {% set new_event = "heating" %}
            {% elif (bed_target > 0 and bed_temp < (bed_target - 2)) or (nozzle_target > 0 and nozzle_temp < (nozzle_target - 2)) %}
                # Still heating mid-print (shouldn't happen often)
                {% set new_event = "heating" %}
            {% else %}
                # Actually printing!
                {% set new_event = "printing" %}
            {% endif %}
        
        # Check if heating (heaters on, not printing yet)
        {% elif bed_target > 0 or nozzle_target > 0 %}
            {% set new_event = "heating" %}
        
        # Check if cooling down (no active print AND still hot)
        {% elif bed_temp > (temp_floor + 10) or nozzle_temp > (temp_floor + 30) %}
            {% set new_event = "cooldown" %}
        
        # Cool and idle - check for bored
        {% else %}
            # Calculate bored threshold in ticks: timeout / update_rate
            {% set bored_ticks = (settings.bored_timeout / settings.update_rate)|int %}
            
            {% if current == "bored" or current == "sleep" %}
                # In bored/sleep - check for sleep transition
                # Only real events (heating/printing/error/cooldown) can break us out
                # Those are handled by the elif branches above
                {% set sleep_ticks = (settings.sleep_timeout / settings.update_rate)|int %}
                {% if current == "sleep" %}
                    # Already sleeping - stay asleep, don't increment anything
                    {% set new_event = "sleep" %}
                {% elif state.bored_ticks >= sleep_ticks %}
                    {% set new_event = "sleep" %}
                {% else %}
                    # Still bored, increment bored_ticks
                    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=bored_ticks VALUE={state.bored_ticks + 1}
                    {% set new_event = "bored" %}
                {% endif %}
            {% elif state.idle_ticks >= bored_ticks %}
                # Just hit bored threshold
                {% set new_event = "bored" %}
            {% else %}
                # Still idle, counting up
                {% set new_event = "idle" %}
            {% endif %}
        {% endif %}
        
        # ----- IDLE TICK COUNTER -----
        # Only increment during idle state (not bored, not busy)
        {% if new_event == "idle" %}
            {% set klipper_busy = printer.idle_timeout.state == "Printing" %}
            {% if klipper_busy %}
                # User is doing something (G28, etc.) - reset timer
                SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=idle_ticks VALUE=0
            {% else %}
                # Truly idle - increment tick counter
                SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=idle_ticks VALUE={state.idle_ticks + 1}
            {% endif %}
        {% endif %}
        # Note: Once bored, ONLY heating/printing/error/cooldown can break out
        
        # ----- EVENT CHANGED? -----
        {% if new_event != current %}
            {% if debug %}
            RESPOND MSG="[AURORA] Event change: {current} → {new_event}"
            {% endif %}
            
            # Update state
            SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=previous_event VALUE='"{current}"'
            SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=current_event VALUE='"{new_event}"'
            
            # Reset idle tick counter if entering a non-idle/bored state
            {% if new_event != "idle" and new_event != "bored" and new_event != "sleep" %}
                SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=idle_ticks VALUE=0
                SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=bored_ticks VALUE=0
            {% endif %}
            
            # Trigger event handler
            _AURORA_HANDLE_EVENT EVENT={new_event}
        {% endif %}
        
        # Reschedule already done at top of macro
        
    {% else %}
        # System inactive - cancel the scheduled run
        UPDATE_DELAYED_GCODE ID=_AURORA_DISPATCHER DURATION=0
        {% if debug %}
        RESPOND MSG="[AURORA] Dispatcher stopped (system inactive)"
        {% endif %}
    {% endif %}

#####################################################################
##                    Event Handler
##
##  Called when event changes. Looks up effect for each group
##  and starts the appropriate effect.
#####################################################################

[gcode_macro _AURORA_HANDLE_EVENT]
description: Handle an Aurora event - start effects for all groups
gcode:
    {% set EVENT = params.EVENT|string %}
    {% set debug = printer["gcode_macro _AURORA_SETTINGS"].debug %}
    {% set groups = printer["gcode_macro _AURORA_GROUPS"] %}
    
    {% if debug %}
    RESPOND MSG="[AURORA] Handling event: {EVENT}"
    {% endif %}
    
    # Stop ALL running animated effects before starting new ones
    UPDATE_DELAYED_GCODE ID=_AURORA_PULSE_LOOP DURATION=0
    UPDATE_DELAYED_GCODE ID=_AURORA_HEARTBEAT_LOOP DURATION=0
    UPDATE_DELAYED_GCODE ID=_AURORA_KIT_LOOP DURATION=0
    UPDATE_DELAYED_GCODE ID=_AURORA_DISCO_LOOP DURATION=0
    UPDATE_DELAYED_GCODE ID=_AURORA_PROGRESS_LOOP DURATION=0
    UPDATE_DELAYED_GCODE ID=_AURORA_THERMAL_LOOP_1 DURATION=0
    UPDATE_DELAYED_GCODE ID=_AURORA_THERMAL_LOOP_2 DURATION=0
    SET_GCODE_VARIABLE MACRO=_AURORA_PULSE_STATE VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_AURORA_HEARTBEAT_STATE VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_AURORA_KIT_STATE VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_AURORA_DISCO_STATE VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_AURORA_PROGRESS_STATE VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_1 VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_2 VARIABLE=active VALUE=False
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=effects_running VALUE=False
    
    # ----- GROUP A -----
    {% if groups.group_a_enabled %}
        # Sub-group A1
        {% set effect_a1 = groups["group_a1_on_" ~ EVENT]|default("off") %}
        {% if effect_a1 == "off" %}
            {% if debug %}RESPOND MSG="[AURORA] A1 ({groups.group_a1_name}): OFF"{% endif %}
            _AURORA_SET_LED_RANGE LED={groups.group_a_neopixel} START={groups.group_a1_start} END={groups.group_a1_end} RED=0 GREEN=0 BLUE=0
        {% else %}
            {% if debug %}RESPOND MSG="[AURORA] A1 ({groups.group_a1_name}): {effect_a1}"{% endif %}
            _AURORA_START_EFFECT EFFECT={effect_a1} LED={groups.group_a_neopixel} START={groups.group_a1_start} END={groups.group_a1_end} GROUP="A1"
        {% endif %}
        
        # Sub-group A2
        {% set effect_a2 = groups["group_a2_on_" ~ EVENT]|default("off") %}
        {% if effect_a2 == "off" %}
            {% if debug %}RESPOND MSG="[AURORA] A2 ({groups.group_a2_name}): OFF"{% endif %}
            _AURORA_SET_LED_RANGE LED={groups.group_a_neopixel} START={groups.group_a2_start} END={groups.group_a2_end} RED=0 GREEN=0 BLUE=0
        {% else %}
            {% if debug %}RESPOND MSG="[AURORA] A2 ({groups.group_a2_name}): {effect_a2}"{% endif %}
            _AURORA_START_EFFECT EFFECT={effect_a2} LED={groups.group_a_neopixel} START={groups.group_a2_start} END={groups.group_a2_end} GROUP="A2"
        {% endif %}
    {% endif %}
    
    # ----- GROUP B -----
    {% if groups.group_b_enabled %}
        # Sub-group B1
        {% set effect_b1 = groups["group_b1_on_" ~ EVENT]|default("off") %}
        {% if effect_b1 == "off" %}
            {% if debug %}RESPOND MSG="[AURORA] B1 ({groups.group_b1_name}): OFF"{% endif %}
            _AURORA_SET_LED_RANGE LED={groups.group_b_neopixel} START={groups.group_b1_start} END={groups.group_b1_end} RED=0 GREEN=0 BLUE=0
        {% else %}
            {% if debug %}RESPOND MSG="[AURORA] B1 ({groups.group_b1_name}): {effect_b1}"{% endif %}
            _AURORA_START_EFFECT EFFECT={effect_b1} LED={groups.group_b_neopixel} START={groups.group_b1_start} END={groups.group_b1_end} GROUP="B1"
        {% endif %}
        
        # Sub-group B2
        {% set effect_b2 = groups["group_b2_on_" ~ EVENT]|default("off") %}
        {% if effect_b2 == "off" %}
            {% if debug %}RESPOND MSG="[AURORA] B2 ({groups.group_b2_name}): OFF"{% endif %}
            _AURORA_SET_LED_RANGE LED={groups.group_b_neopixel} START={groups.group_b2_start} END={groups.group_b2_end} RED=0 GREEN=0 BLUE=0
        {% else %}
            {% if debug %}RESPOND MSG="[AURORA] B2 ({groups.group_b2_name}): {effect_b2}"{% endif %}
            _AURORA_START_EFFECT EFFECT={effect_b2} LED={groups.group_b_neopixel} START={groups.group_b2_start} END={groups.group_b2_end} GROUP="B2"
        {% endif %}
    {% endif %}

#####################################################################
##                    Effect Starter
##
##  Routes to the correct effect macro based on name.
##  If name matches a color, uses solid effect with that color.
#####################################################################

[gcode_macro _AURORA_START_EFFECT]
description: Start an effect on a specific LED range
gcode:
    {% set EFFECT_RAW = params.EFFECT|string|lower %}
    {% set LED = params.LED|string %}
    {% set START = params.START|int %}
    {% set END = params.END|int %}
    {% set GROUP = params.GROUP|default("?")|string %}
    {% set debug = printer["gcode_macro _AURORA_SETTINGS"].debug %}
    {% set colors = printer["gcode_macro _AURORA_COLORS"] %}
    
    # ----- PARSE "effect:color" FORMAT -----
    # If EFFECT contains ":", split into effect name and color override
    {% if ":" in EFFECT_RAW %}
        {% set parts = EFFECT_RAW.split(":") %}
        {% set EFFECT = parts[0] %}
        {% set COLOR = parts[1] %}
    {% else %}
        {% set EFFECT = EFFECT_RAW %}
        {% set COLOR = "" %}
    {% endif %}
    
    # Check if EFFECT is a color name (solid color shortcut)
    {% set is_color = colors[EFFECT] is defined %}
    
    {% if is_color %}
        # It's a color name - use solid effect
        {% set rgb = colors[EFFECT] %}
        {% if debug %}RESPOND MSG="[AURORA] {GROUP}: solid color '{EFFECT}'"{% endif %}
        _AURORA_SOLID LED={LED} START={START} END={END} R={rgb[0]} G={rgb[1]} B={rgb[2]}
    
    {% elif EFFECT == "solid" %}
        # Solid with default color (white) or override
        {% if COLOR and colors[COLOR] is defined %}
            {% set rgb = colors[COLOR] %}
            _AURORA_SOLID LED={LED} START={START} END={END} R={rgb[0]} G={rgb[1]} B={rgb[2]}
        {% else %}
            _AURORA_SOLID LED={LED} START={START} END={END} R=1.0 G=1.0 B=1.0
        {% endif %}
    
    {% elif EFFECT == "pulse" %}
        {% if COLOR %}
            _AURORA_PULSE_START LED={LED} START={START} END={END} GROUP={GROUP} COLOR={COLOR}
        {% else %}
            _AURORA_PULSE_START LED={LED} START={START} END={END} GROUP={GROUP}
        {% endif %}
    
    {% elif EFFECT == "heartbeat" %}
        {% if COLOR %}
            _AURORA_HEARTBEAT_START LED={LED} START={START} END={END} GROUP={GROUP} COLOR={COLOR}
        {% else %}
            _AURORA_HEARTBEAT_START LED={LED} START={START} END={END} GROUP={GROUP}
        {% endif %}
    
    {% elif EFFECT == "thermal" %}
        {% if COLOR %}
            _AURORA_THERMAL_START LED={LED} START={START} END={END} GROUP={GROUP} COLOR={COLOR}
        {% else %}
            _AURORA_THERMAL_START LED={LED} START={START} END={END} GROUP={GROUP}
        {% endif %}
    
    {% elif EFFECT == "kit" %}
        {% if COLOR %}
            _AURORA_KIT_START LED={LED} START={START} END={END} GROUP={GROUP} COLOR={COLOR}
        {% else %}
            _AURORA_KIT_START LED={LED} START={START} END={END} GROUP={GROUP}
        {% endif %}
    
    {% elif EFFECT == "disco" %}
        _AURORA_DISCO_START LED={LED} START={START} END={END} GROUP={GROUP}
    
    {% elif EFFECT == "progress" %}
        {% if COLOR %}
            _AURORA_PROGRESS_START LED={LED} START={START} END={END} GROUP={GROUP} COLOR={COLOR}
        {% else %}
            _AURORA_PROGRESS_START LED={LED} START={START} END={END} GROUP={GROUP}
        {% endif %}
    
    {% else %}
        {% if debug %}RESPOND MSG="[AURORA] {GROUP}: Unknown effect '{EFFECT}', using solid white"{% endif %}
        _AURORA_SOLID LED={LED} START={START} END={END} R=1.0 G=1.0 B=1.0
    {% endif %}
