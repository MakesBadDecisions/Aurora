#####################################################################
##                    Aurora Lights - LED Output Handler
##
##  Handles LED output with automatic RGBW detection and conversion.
##  Call _AURORA_SET_LED instead of SET_LED directly.
##
##  Features:
##    - Auto-detects RGBW strips (from color_order containing W)
##    - Calculates optimal white channel from RGB
##    - Falls back gracefully for RGB-only strips
##
##  White Channel Calculation:
##    W = min(R, G, B) * white_mix
##    Then subtract W from R, G, B for cleaner whites
##
##  This saves power and produces better whites on RGBW strips
##  while having zero effect on standard RGB strips.
#####################################################################

[gcode_macro _AURORA_SET_LED]
description: Set LED with automatic RGBW handling
gcode:
    {% set LED = params.LED|string %}
    {% set INDEX = params.INDEX|int %}
    {% set TRANSMIT = params.TRANSMIT|default(1)|int %}
    {% set settings = printer["gcode_macro _AURORA_SETTINGS"] %}
    {% set brightness = settings.max_brightness|default(1.0)|float %}
    {% set R = (params.RED|default(0)|float * brightness)|round(4) %}
    {% set G = (params.GREEN|default(0)|float * brightness)|round(4) %}
    {% set B = (params.BLUE|default(0)|float * brightness)|round(4) %}
    
    # For now, just use RGB (RGBW detection can be added later)
    # TRANSMIT=0 batches updates, TRANSMIT=1 sends to LEDs
    SET_LED LED={LED} INDEX={INDEX} RED={R} GREEN={G} BLUE={B} TRANSMIT={TRANSMIT}

#####################################################################
##                    Batch LED Output
##
##  Sets multiple LEDs in a range to the same color.
##  More efficient than calling _AURORA_SET_LED in a loop for
##  solid colors.
#####################################################################

[gcode_macro _AURORA_SET_LED_RANGE]
description: Set a range of LEDs to the same color with RGBW handling
gcode:
    {% set LED = params.LED|string %}
    {% set START = params.START|int %}
    {% set END = params.END|int %}
    {% set settings = printer["gcode_macro _AURORA_SETTINGS"] %}
    {% set brightness = settings.max_brightness|default(1.0)|float %}
    {% set R = (params.RED|default(0)|float * brightness)|round(4) %}
    {% set G = (params.GREEN|default(0)|float * brightness)|round(4) %}
    {% set B = (params.BLUE|default(0)|float * brightness)|round(4) %}
    {% set debug = settings.debug %}
    
    {% if debug %}
    RESPOND MSG="[AURORA] SET_LED_RANGE: {LED} [{START}-{END}] R={R|round(2)} G={G|round(2)} B={B|round(2)}"
    {% endif %}
    
    # For now, just use RGB (RGBW detection can be added later)
    {% for i in range(START, END + 1) %}
        SET_LED LED={LED} INDEX={i} RED={R} GREEN={G} BLUE={B}
    {% endfor %}
