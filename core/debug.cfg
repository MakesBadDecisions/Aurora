#####################################################################
##                    Aurora Lights - Debug Tools
##
##  Diagnostic macros for troubleshooting Aurora system.
#####################################################################

[gcode_macro AURORA_STATUS]
description: Show current Aurora state and configuration
gcode:
    {% set state = printer["gcode_macro _AURORA_STATE"] %}
    {% set settings = printer["gcode_macro _AURORA_SETTINGS"] %}
    {% set groups = printer["gcode_macro _AURORA_GROUPS"] %}
    
    RESPOND MSG="===== AURORA LIGHTS STATUS ====="
    RESPOND MSG="System Active: {state.system_active}"
    RESPOND MSG="Current Event: {state.current_event}"
    RESPOND MSG="Previous Event: {state.previous_event}"
    RESPOND MSG="Effects Running: {state.effects_running}"
    RESPOND MSG=""
    RESPOND MSG="--- Bored Timer ---"
    {% set update_rate = settings.update_rate %}
    {% set bored_ticks = (settings.bored_timeout / update_rate)|int %}
    {% set idle_ticks = state.idle_ticks %}
    {% set ticks_remaining = bored_ticks - idle_ticks %}
    {% set idle_seconds = idle_ticks * update_rate %}
    {% set remaining_seconds = ticks_remaining * update_rate %}
    RESPOND MSG="Idle Ticks: {idle_ticks} / {bored_ticks}"
    RESPOND MSG="Idle Duration: {idle_seconds|round(1)}s ({(idle_seconds/60)|round(1)} min)"
    RESPOND MSG="Bored Timeout: {settings.bored_timeout}s"
    {% if ticks_remaining > 0 %}
    RESPOND MSG="Bored In: {remaining_seconds|round(1)}s ({(remaining_seconds/60)|round(1)} min)"
    {% else %}
    RESPOND MSG="Bored In: NOW (should be bored!)"
    {% endif %}
    RESPOND MSG=""
    RESPOND MSG="--- Sleep Timer ---"
    {% set sleep_ticks = (settings.sleep_timeout / update_rate)|int %}
    {% set bored_tick_count = state.bored_ticks %}
    {% set sleep_remaining = sleep_ticks - bored_tick_count %}
    {% set bored_seconds = bored_tick_count * update_rate %}
    {% set sleep_remaining_seconds = sleep_remaining * update_rate %}
    RESPOND MSG="Bored Ticks: {bored_tick_count} / {sleep_ticks}"
    RESPOND MSG="Bored Duration: {bored_seconds|round(1)}s ({(bored_seconds/60)|round(1)} min)"
    RESPOND MSG="Sleep Timeout: {settings.sleep_timeout}s"
    {% if state.current_event == "bored" %}
    {% if sleep_remaining > 0 %}
    RESPOND MSG="Sleep In: {sleep_remaining_seconds|round(1)}s ({(sleep_remaining_seconds/60)|round(1)} min)"
    {% else %}
    RESPOND MSG="Sleep In: NOW (should be sleeping!)"
    {% endif %}
    {% else %}
    RESPOND MSG="Sleep In: N/A (not bored)"
    {% endif %}
    RESPOND MSG=""
    RESPOND MSG="--- Settings ---"
    RESPOND MSG="Debug: {settings.debug}"
    RESPOND MSG="Update Rate: {settings.update_rate}s"
    RESPOND MSG=""
    RESPOND MSG="--- Klipper State ---"
    RESPOND MSG="Print Stats: {printer.print_stats.state}"
    RESPOND MSG="Idle Timeout: {printer.idle_timeout.state}"
    RESPOND MSG="Bed: {printer.heater_bed.temperature|round(1)}°C / {printer.heater_bed.target}°C"
    RESPOND MSG="Nozzle: {printer.extruder.temperature|round(1)}°C / {printer.extruder.target}°C"
    RESPOND MSG="===== END STATUS ====="

[gcode_macro AURORA_TEST_EVENT]
description: Manually trigger an Aurora event for testing. Use HOLD=1 to stop dispatcher.
gcode:
    {% set EVENT = params.EVENT|default("idle")|string|lower %}
    {% set HOLD = params.HOLD|default(1)|int %}
    {% set debug = printer["gcode_macro _AURORA_SETTINGS"].debug %}
    
    # Stop dispatcher so it doesn't override our test (default behavior now)
    {% if HOLD %}
    UPDATE_DELAYED_GCODE ID=_AURORA_DISPATCHER DURATION=0
    {% if debug %}
    RESPOND MSG="[AURORA] TEST: Forcing event={EVENT} (dispatcher paused - use AURORA_WAKE to resume)"
    {% endif %}
    {% else %}
    {% if debug %}
    RESPOND MSG="[AURORA] TEST: Forcing event={EVENT}"
    {% endif %}
    {% endif %}
    
    # Force the event state
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=previous_event VALUE='"{printer["gcode_macro _AURORA_STATE"].current_event}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=current_event VALUE='"{EVENT}"'
    
    # Call the handler directly (bypass dispatcher detection)
    _AURORA_HANDLE_EVENT EVENT={EVENT}

[gcode_macro AURORA_STOP]
description: Stop all Aurora effects
gcode:
    {% set debug = printer["gcode_macro _AURORA_SETTINGS"].debug %}
    
    {% if debug %}
    RESPOND MSG="[AURORA] Stopping all effects"
    {% endif %}
    
    # Stop dispatcher
    UPDATE_DELAYED_GCODE ID=_AURORA_DISPATCHER DURATION=0
    
    # Stop all effect loops
    UPDATE_DELAYED_GCODE ID=_AURORA_PULSE_LOOP DURATION=0
    UPDATE_DELAYED_GCODE ID=_AURORA_HEARTBEAT_LOOP DURATION=0
    UPDATE_DELAYED_GCODE ID=_AURORA_KIT_LOOP DURATION=0
    UPDATE_DELAYED_GCODE ID=_AURORA_DISCO_LOOP DURATION=0
    UPDATE_DELAYED_GCODE ID=_AURORA_PROGRESS_LOOP DURATION=0
    
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=effects_running VALUE=False
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=system_active VALUE=False

[gcode_macro AURORA_START]
description: Start/restart Aurora system
gcode:
    {% set debug = printer["gcode_macro _AURORA_SETTINGS"].debug %}
    
    {% if debug %}
    RESPOND MSG="[AURORA] Starting system"
    {% endif %}
    
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=system_active VALUE=True
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=current_event VALUE='"idle"'
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=idle_ticks VALUE=0
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=bored_ticks VALUE=0
    
    # Start dispatcher
    UPDATE_DELAYED_GCODE ID=_AURORA_DISPATCHER DURATION=0.5

[gcode_macro AURORA_WAKE]
description: Restart dispatcher after Klipper blocking (call from PRINT_START)
gcode:
    {% set debug = printer["gcode_macro _AURORA_SETTINGS"].debug %}
    {% if debug %}
    RESPOND MSG="[AURORA] WAKE called - forcing dispatcher restart"
    {% endif %}
    
    # Force immediate state detection (don't wait for delayed_gcode)
    {% set bed_temp = printer.heater_bed.temperature %}
    {% set bed_target = printer.heater_bed.target %}
    {% set nozzle_temp = printer.extruder.temperature %}
    {% set nozzle_target = printer.extruder.target %}
    {% set print_state = printer.print_stats.state %}
    {% set progress = printer.print_stats.progress %}
    {% set temp_floor = printer["gcode_macro _AURORA_SETTINGS"].temp_floor %}
    
    # Determine event - same logic as dispatcher
    # Note: "complete" and "cancelled" print states fall through to cooldown
    {% if bed_target > 0 or nozzle_target > 0 %}
        # Heaters are on - check if we're still heating
        {% if (bed_target > 0 and bed_temp < (bed_target - 2)) or (nozzle_target > 0 and nozzle_temp < (nozzle_target - 2)) %}
            {% set event = "heating" %}
        {% elif print_state == "printing" or print_state == "paused" %}
            {% set event = "printing" %}
        {% else %}
            {% set event = "heating" %}
        {% endif %}
    {% elif print_state == "printing" or print_state == "paused" %}
        {% set event = "printing" %}
    {% elif bed_temp > (temp_floor + 10) or nozzle_temp > (temp_floor + 30) %}
        # Still hot, no active print = cooldown
        {% set event = "cooldown" %}
    {% else %}
        {% set event = "idle" %}
    {% endif %}
    
    {% if debug %}
    RESPOND MSG="[AURORA] WAKE detected: {event} (bed={bed_temp|round(1)}/{bed_target}, nozzle={nozzle_temp|round(1)}/{nozzle_target})"
    {% endif %}
    
    # Update state and trigger handler directly
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=previous_event VALUE='"{printer["gcode_macro _AURORA_STATE"].current_event}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=current_event VALUE='"{event}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=idle_ticks VALUE=0
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=bored_ticks VALUE=0
    _AURORA_HANDLE_EVENT EVENT={event}
    
    # Then restart the dispatcher loop for ongoing monitoring
    UPDATE_DELAYED_GCODE ID=_AURORA_DISPATCHER DURATION=0.5

#####################################################################
##                    Color Preview Tools
#####################################################################

[gcode_macro AURORA_SHOW_COLOR]
description: Preview a color on all LEDs. Usage: AURORA_SHOW_COLOR COLOR=cyan
gcode:
    {% set COLOR = params.COLOR|default("white")|string|lower %}
    {% set colors = printer["gcode_macro _AURORA_COLORS"] %}
    {% set groups = printer["gcode_macro _AURORA_GROUPS"] %}
    
    {% if colors[COLOR] is defined %}
        {% set rgb = colors[COLOR] %}
        RESPOND MSG="[AURORA] Showing color: {COLOR} = R{rgb[0]} G{rgb[1]} B{rgb[2]}"
        
        # Apply to all groups
        {% if groups.group_a_enabled %}
            _AURORA_SET_LED_RANGE LED={groups.group_a_neopixel} START={groups.group_a1_start} END={groups.group_a2_end} RED={rgb[0]} GREEN={rgb[1]} BLUE={rgb[2]}
        {% endif %}
        {% if groups.group_b_enabled %}
            _AURORA_SET_LED_RANGE LED={groups.group_b_neopixel} START={groups.group_b1_start} END={groups.group_b2_end} RED={rgb[0]} GREEN={rgb[1]} BLUE={rgb[2]}
        {% endif %}
    {% else %}
        RESPOND MSG="[AURORA] Unknown color: {COLOR}"
        RESPOND MSG="[AURORA] Use AURORA_LIST_COLORS to see available colors"
    {% endif %}

[gcode_macro AURORA_LIST_COLORS]
description: List all available color names
gcode:
