#####################################################################
##                    Aurora Lights - Color Definitions
##
##  Color lookup table. Use color names in your config instead of
##  RGB values. Add custom colors here as needed.
##
##  Usage in _AURORA_GROUPS:
##    variable_group_a1_on_error: "red"
##    variable_group_b1_on_printing: "purple"
##
##  Colors are [R, G, B] values from 0.0 to 1.0
#####################################################################

[gcode_macro _AURORA_COLORS]
description: Color name to RGB lookup table

# ----- Basic Colors -----
variable_red:         [1.0, 0.0, 0.0]
variable_green:       [0.0, 1.0, 0.0]
variable_blue:        [0.0, 0.0, 1.0]
variable_white:       [1.0, 1.0, 1.0]
variable_black:       [0.0, 0.0, 0.0]    # Same as off

# ----- Warm Colors -----
variable_orange:      [1.0, 0.5, 0.0]
variable_yellow:      [1.0, 1.0, 0.0]
variable_gold:        [1.0, 0.75, 0.0]
variable_amber:       [1.0, 0.6, 0.0]
variable_coral:       [1.0, 0.5, 0.3]
variable_salmon:      [1.0, 0.6, 0.5]
variable_warm_white:  [1.0, 0.8, 0.6]

# ----- Cool Colors -----
variable_cyan:        [0.0, 1.0, 1.0]
variable_teal:        [0.0, 0.8, 0.7]
variable_aqua:        [0.0, 1.0, 0.8]
variable_sky:         [0.4, 0.7, 1.0]
variable_ice:         [0.7, 0.9, 1.0]
variable_cool_white:  [0.9, 0.95, 1.0]

# ----- Purple/Pink Family -----
variable_purple:      [0.5, 0.0, 1.0]
variable_magenta:     [1.0, 0.0, 1.0]
variable_pink:        [1.0, 0.4, 0.7]
variable_hot_pink:    [1.0, 0.2, 0.6]
variable_violet:      [0.6, 0.0, 0.8]
variable_lavender:    [0.7, 0.5, 1.0]
variable_plum:        [0.6, 0.2, 0.6]

# ----- Green Family -----
variable_lime:        [0.5, 1.0, 0.0]
variable_mint:        [0.4, 1.0, 0.6]
variable_emerald:     [0.0, 0.8, 0.4]
variable_forest:      [0.0, 0.5, 0.2]

# ----- Special -----
variable_fire:        [1.0, 0.3, 0.0]    # Deep orange-red
variable_lava:        [1.0, 0.2, 0.0]    # Red-orange
variable_sunset:      [1.0, 0.4, 0.2]    # Warm sunset
variable_sunrise:     [1.0, 0.6, 0.4]    # Soft morning
variable_ocean:       [0.0, 0.4, 0.8]    # Deep blue
variable_steel:       [0.5, 0.5, 0.6]    # Industrial gray-blue
variable_copper:      [0.8, 0.5, 0.2]    # Metallic copper
variable_bronze:      [0.7, 0.5, 0.2]    # Metallic bronze
variable_rose:        [1.0, 0.3, 0.4]    # Rose gold vibe
variable_peach:       [1.0, 0.7, 0.5]    # Soft peach
variable_cream:       [1.0, 0.95, 0.8]   # Creamy warm
variable_electric:    [0.2, 0.8, 1.0]    # Electric blue
variable_neon_green:  [0.4, 1.0, 0.2]    # Radioactive
variable_blood:       [0.6, 0.0, 0.0]    # Dark red
variable_royal:       [0.3, 0.0, 0.8]    # Royal purple
variable_cobalt:      [0.0, 0.3, 0.9]    # Deep cobalt blue

# ----- Neon/Vibrant -----
variable_neon_pink:   [1.0, 0.1, 0.5]    # Hot neon pink
variable_neon_blue:   [0.1, 0.5, 1.0]    # Electric neon blue
variable_neon_orange: [1.0, 0.4, 0.0]    # Bright neon orange
variable_neon_yellow: [1.0, 1.0, 0.2]    # Highlighter yellow
variable_neon_purple: [0.7, 0.0, 1.0]    # Blacklight purple

# ----- Pastels -----
variable_baby_blue:   [0.6, 0.8, 1.0]    # Soft baby blue
variable_baby_pink:   [1.0, 0.7, 0.8]    # Soft baby pink
variable_seafoam:     [0.5, 1.0, 0.8]    # Light seafoam
variable_lilac:       [0.8, 0.6, 1.0]    # Light purple
variable_buttercup:   [1.0, 0.9, 0.5]    # Soft yellow

# ----- Earth Tones -----
variable_sand:        [0.9, 0.8, 0.6]    # Sandy beige
variable_clay:        [0.8, 0.5, 0.4]    # Terracotta
variable_moss:        [0.4, 0.6, 0.3]    # Mossy green
variable_bark:        [0.4, 0.3, 0.2]    # Tree bark brown
variable_stone:       [0.6, 0.6, 0.6]    # Neutral gray

# ----- Gaming/RGB Meme -----
variable_rgb_red:     [1.0, 0.0, 0.0]    # Pure R
variable_rgb_green:   [0.0, 1.0, 0.0]    # Pure G
variable_rgb_blue:    [0.0, 0.0, 1.0]    # Pure B
variable_vaporwave:   [1.0, 0.3, 0.8]    # A E S T H E T I C
variable_cyberpunk:   [1.0, 0.0, 0.6]    # Cyberpunk magenta
variable_matrix:      [0.0, 1.0, 0.3]    # Matrix green
variable_portal_blue: [0.0, 0.6, 1.0]    # Portal 2 blue
variable_portal_orange: [1.0, 0.5, 0.0]  # Portal 2 orange

gcode:
    # Storage macro only - lookup happens in _AURORA_START_EFFECT
