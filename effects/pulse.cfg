#####################################################################
##                    Aurora Effect: Pulse
##
##  Smooth brightness oscillation using triangle wave.
##
##  Tunable parameters in _AURORA_EFFECT_PULSE:
##    speed: Wave cycles per second (2 = 1 sec full cycle)
##    min_brightness: Dimmest point (0.0-1.0)
##    max_brightness: Brightest point (0.0-1.0)
##    color: Color name from _AURORA_COLORS
#####################################################################

[gcode_macro _AURORA_PULSE_START]
description: Start pulse effect on LED range
gcode:
    {% set LED = params.LED|string %}
    {% set START = params.START|int %}
    {% set END = params.END|int %}
    {% set GROUP = params.GROUP|default("?")|string %}
    {% set COLOR = params.COLOR|default("")|string|lower %}
    {% set debug = printer["gcode_macro _AURORA_SETTINGS"].debug %}
    
    # Store target info for the loop
    SET_GCODE_VARIABLE MACRO=_AURORA_PULSE_STATE VARIABLE=led VALUE='"{LED}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_PULSE_STATE VARIABLE=start_idx VALUE={START}
    SET_GCODE_VARIABLE MACRO=_AURORA_PULSE_STATE VARIABLE=end_idx VALUE={END}
    SET_GCODE_VARIABLE MACRO=_AURORA_PULSE_STATE VARIABLE=group VALUE='"{GROUP}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_PULSE_STATE VARIABLE=color_override VALUE='"{COLOR}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_PULSE_STATE VARIABLE=active VALUE=True
    
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=effects_running VALUE=True
    
    # Immediately show pulse color at mid brightness as "effect started" indicator
    # The loop will animate once it runs
    {% set effect = printer["gcode_macro _AURORA_EFFECT_PULSE"] %}
    {% set colors = printer["gcode_macro _AURORA_COLORS"] %}
    {% if COLOR and COLOR in colors %}
        {% set rgb = colors[COLOR] %}
    {% else %}
        {% set rgb = colors[effect.color] %}
    {% endif %}
    {% set brightness = (effect.min_brightness + effect.max_brightness) / 2 %}
    _AURORA_SET_LED_RANGE LED={LED} START={START} END={END} RED={rgb[0] * brightness} GREEN={rgb[1] * brightness} BLUE={rgb[2] * brightness}
    
    # Start the animation loop
    UPDATE_DELAYED_GCODE ID=_AURORA_PULSE_LOOP DURATION=0.001

[gcode_macro _AURORA_PULSE_STATE]
description: Pulse effect runtime state
variable_led: "toolhead_leds"
variable_start_idx: 1
variable_end_idx: 1
variable_group: "?"
variable_color_override: ""
variable_active: False
gcode:

[delayed_gcode _AURORA_PULSE_LOOP]
gcode:
    {% set state = printer["gcode_macro _AURORA_PULSE_STATE"] %}
    {% set settings = printer["gcode_macro _AURORA_SETTINGS"] %}
    {% set effect = printer["gcode_macro _AURORA_EFFECT_PULSE"] %}
    {% set colors = printer["gcode_macro _AURORA_COLORS"] %}
    {% set groups = printer["gcode_macro _AURORA_GROUPS"] %}
    {% set debug = settings.debug %}
    
    {% if state.active %}
        {% set LED = state.led %}
        {% set START = state.start_idx %}
        {% set END = state.end_idx %}
        
        # Get effect parameters
        {% set speed = effect.speed %}
        {% set min_b = effect.min_brightness %}
        {% set max_b = effect.max_brightness %}
        {% set color_name = effect.color %}
        
        # ----- TRIANGLE WAVE CALCULATION -----
        {% set t = printer.system_stats.cputime %}
        {% set wave = ((t * speed) % 2) %}
        {% if wave > 1 %}
            {% set wave = 2 - wave %}
        {% endif %}
        # wave is now 0.0 → 1.0 → 0.0 repeating
        
        # Calculate brightness
        {% set brightness = min_b + ((max_b - min_b) * wave) %}
        
        # Get color from settings
        {% set rgb = colors[color_name] %}
        
        # Apply brightness to color
        {% set r = rgb[0] * brightness %}
        {% set g = rgb[1] * brightness %}
        {% set b = rgb[2] * brightness %}
        
        # Set LEDs in range
        {% for i in range(START, END + 1) %}
            _AURORA_SET_LED LED={LED} INDEX={i} RED={r} GREEN={g} BLUE={b}
        {% endfor %}
        
        # Reschedule
        UPDATE_DELAYED_GCODE ID=_AURORA_PULSE_LOOP DURATION=0.1
    {% endif %}

[gcode_macro _AURORA_PULSE_STOP]
description: Stop pulse effect
gcode:
    SET_GCODE_VARIABLE MACRO=_AURORA_PULSE_STATE VARIABLE=active VALUE=False
    UPDATE_DELAYED_GCODE ID=_AURORA_PULSE_LOOP DURATION=0
