#####################################################################
##                    Aurora Effect: Thermal Progress
##
##  Fill LEDs like a progress bar based on heating progress.
##  Uses (current_temp - floor) / (target_temp - floor) for %.
##  SUPPORTS MULTIPLE GROUPS - B1 and B2 can run independently!
##
##  Tunable parameters in _AURORA_EFFECT_THERMAL:
##    cold_color: Color for unlit LEDs (background)
##    hot_color: Color for lit LEDs (progress)
##    brightness: Overall brightness (0.0-1.0)
##    heater: Which heater to track ("bed", "extruder", or "max")
#####################################################################

[gcode_macro _AURORA_THERMAL_START]
description: Start thermal progress effect (routes to group-specific instance)
gcode:
    {% set LED = params.LED|string %}
    {% set START = params.START|int %}
    {% set END = params.END|int %}
    {% set GROUP = params.GROUP|default("?")|string %}
    {% set COLOR = params.COLOR|default("")|string|lower %}
    {% set debug = printer["gcode_macro _AURORA_SETTINGS"].debug %}
    {% set settings = printer["gcode_macro _AURORA_SETTINGS"] %}
    {% set effect = printer["gcode_macro _AURORA_EFFECT_THERMAL"] %}
    {% set colors = printer["gcode_macro _AURORA_COLORS"] %}
    
    # Parse COLOR param - could be a heater source (bed, extruder) or color override
    {% set heater_ovr = "" %}
    {% set color_ovr = "" %}
    {% if COLOR in ["bed", "extruder", "hotend"] %}
        {% set heater_ovr = "bed" if COLOR == "bed" else "extruder" %}
    {% elif COLOR %}
        {% set color_ovr = COLOR %}
    {% endif %}
    
    # ----- IMMEDIATE RENDER (before blocking G-code can freeze us) -----
    {% set led_count = END - START + 1 %}
    {% set temp_floor = settings.temp_floor %}
    {% set brightness = effect.brightness %}
    
    {% set bed_current = printer.heater_bed.temperature|default(0) %}
    {% set bed_target = printer.heater_bed.target|default(0) %}
    {% set ext_current = printer.extruder.temperature|default(0) %}
    {% set ext_target = printer.extruder.target|default(0) %}
    
    {% if heater_ovr == "bed" %}
        {% set current = bed_current %}
        {% set target = bed_target %}
    {% elif heater_ovr == "extruder" %}
        {% set current = ext_current %}
        {% set target = ext_target %}
    {% else %}
        # Auto-detect which heater to track
        {% if bed_target > temp_floor and ext_target > temp_floor %}
            {% set bed_pct = (bed_current - temp_floor) / (bed_target - temp_floor) if bed_target > temp_floor else 1 %}
            {% set ext_pct = (ext_current - temp_floor) / (ext_target - temp_floor) if ext_target > temp_floor else 1 %}
            {% if bed_pct < ext_pct %}
                {% set current = bed_current %}
                {% set target = bed_target %}
            {% else %}
                {% set current = ext_current %}
                {% set target = ext_target %}
            {% endif %}
        {% elif bed_target > temp_floor %}
            {% set current = bed_current %}
            {% set target = bed_target %}
        {% elif ext_target > temp_floor %}
            {% set current = ext_current %}
            {% set target = ext_target %}
        {% else %}
            {% set current = temp_floor %}
            {% set target = temp_floor + 1 %}
        {% endif %}
    {% endif %}
    
    {% set temp_range = target - temp_floor %}
    {% if temp_range > 0 %}
        {% set progress = (current - temp_floor) / temp_range %}
        {% set progress = [[0.0, progress]|max, 1.0]|min %}
    {% else %}
        {% set progress = 0.0 %}
    {% endif %}
    
    {% set lit_count = ((progress * led_count) + 0.5)|int %}
    {% set cold_rgb = colors[effect.cold_color] %}
    {% if color_ovr and color_ovr in colors %}
        {% set hot_rgb = colors[color_ovr] %}
    {% else %}
        {% set hot_rgb = colors[effect.hot_color] %}
    {% endif %}
    
    # Render current thermal state immediately
    {% for i in range(led_count) %}
        {% set idx = START + i %}
        {% set led_num = i + 1 %}
        {% set transmit = 1 if idx == END else 0 %}
        {% if led_num <= lit_count %}
            {% set grad_pos = i / (led_count - 1) if led_count > 1 else 1 %}
            {% set r = (cold_rgb[0] + (hot_rgb[0] - cold_rgb[0]) * grad_pos) * brightness %}
            {% set g = (cold_rgb[1] + (hot_rgb[1] - cold_rgb[1]) * grad_pos) * brightness %}
            {% set b = (cold_rgb[2] + (hot_rgb[2] - cold_rgb[2]) * grad_pos) * brightness %}
            _AURORA_SET_LED LED={LED} INDEX={idx} RED={r} GREEN={g} BLUE={b} TRANSMIT={transmit}
        {% else %}
            {% set r = cold_rgb[0] * brightness * 0.1 %}
            {% set g = cold_rgb[1] * brightness * 0.1 %}
            {% set b = cold_rgb[2] * brightness * 0.1 %}
            _AURORA_SET_LED LED={LED} INDEX={idx} RED={r} GREEN={g} BLUE={b} TRANSMIT={transmit}
        {% endif %}
    {% endfor %}
    
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=effects_running VALUE=True
    
    # Route to group-specific state/loop based on GROUP name
    {% if GROUP in ["B1", "A1"] %}
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_1 VARIABLE=led VALUE='"{LED}"'
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_1 VARIABLE=start_idx VALUE={START}
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_1 VARIABLE=end_idx VALUE={END}
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_1 VARIABLE=group VALUE='"{GROUP}"'
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_1 VARIABLE=heater_override VALUE='"{heater_ovr}"'
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_1 VARIABLE=color_override VALUE='"{color_ovr}"'
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_1 VARIABLE=active VALUE=True
        UPDATE_DELAYED_GCODE ID=_AURORA_THERMAL_LOOP_1 DURATION=0.001
    {% else %}
        # B2, A2, or any other group uses instance 2
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_2 VARIABLE=led VALUE='"{LED}"'
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_2 VARIABLE=start_idx VALUE={START}
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_2 VARIABLE=end_idx VALUE={END}
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_2 VARIABLE=group VALUE='"{GROUP}"'
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_2 VARIABLE=heater_override VALUE='"{heater_ovr}"'
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_2 VARIABLE=color_override VALUE='"{color_ovr}"'
        SET_GCODE_VARIABLE MACRO=_AURORA_THERMAL_STATE_2 VARIABLE=active VALUE=True
        UPDATE_DELAYED_GCODE ID=_AURORA_THERMAL_LOOP_2 DURATION=0.001
    {% endif %}
    
    {% if debug %}
    RESPOND MSG="[AURORA] Thermal started on {GROUP} (heater: {heater_ovr if heater_ovr else 'default'})"
    {% endif %}

#====================================================================
#                    THERMAL INSTANCE 1 (B1, A1)
#====================================================================

[gcode_macro _AURORA_THERMAL_STATE_1]
variable_led: "chamber_lights"
variable_start_idx: 1
variable_end_idx: 18
variable_group: "?"
variable_heater_override: ""
variable_color_override: ""
variable_active: False
gcode:

[delayed_gcode _AURORA_THERMAL_LOOP_1]
initial_duration: 0
gcode:
    {% set state = printer["gcode_macro _AURORA_THERMAL_STATE_1"] %}
    {% set settings = printer["gcode_macro _AURORA_SETTINGS"] %}
    {% set effect = printer["gcode_macro _AURORA_EFFECT_THERMAL"] %}
    {% set colors = printer["gcode_macro _AURORA_COLORS"] %}
    
    {% if state.active %}
        {% set LED = state.led %}
        {% set START = state.start_idx %}
        {% set END = state.end_idx %}
        {% set led_count = END - START + 1 %}
        {% set temp_floor = settings.temp_floor %}
        {% set brightness = effect.brightness %}
        {% if state.heater_override %}
            {% set heater_choice = state.heater_override %}
        {% else %}
            {% set heater_choice = effect.heater|default("max")|lower %}
        {% endif %}
        
        {% set bed_current = printer.heater_bed.temperature|default(0) %}
        {% set bed_target = printer.heater_bed.target|default(0) %}
        {% set ext_current = printer.extruder.temperature|default(0) %}
        {% set ext_target = printer.extruder.target|default(0) %}
        
        {% if heater_choice == "bed" %}
            {% set current = bed_current %}
            {% set target = bed_target %}
        {% elif heater_choice == "extruder" %}
            {% set current = ext_current %}
            {% set target = ext_target %}
        {% else %}
            {% if bed_target > temp_floor and ext_target > temp_floor %}
                {% set bed_pct = (bed_current - temp_floor) / (bed_target - temp_floor) if bed_target > temp_floor else 1 %}
                {% set ext_pct = (ext_current - temp_floor) / (ext_target - temp_floor) if ext_target > temp_floor else 1 %}
                {% if bed_pct < ext_pct %}
                    {% set current = bed_current %}
                    {% set target = bed_target %}
                {% else %}
                    {% set current = ext_current %}
                    {% set target = ext_target %}
                {% endif %}
            {% elif bed_target > temp_floor %}
                {% set current = bed_current %}
                {% set target = bed_target %}
            {% elif ext_target > temp_floor %}
                {% set current = ext_current %}
                {% set target = ext_target %}
            {% else %}
                {% set current = temp_floor %}
                {% set target = temp_floor + 1 %}
            {% endif %}
        {% endif %}
        
        {% set temp_range = target - temp_floor %}
        {% if temp_range > 0 %}
            {% set progress = (current - temp_floor) / temp_range %}
            {% set progress = [[0.0, progress]|max, 1.0]|min %}
        {% else %}
            {% set progress = 0.0 %}
        {% endif %}
        
        {% set lit_count = ((progress * led_count) + 0.5)|int %}
        
        {% set cold_rgb = colors[effect.cold_color] %}
        {% if state.color_override and state.color_override in colors %}
            {% set hot_rgb = colors[state.color_override] %}
        {% else %}
            {% set hot_rgb = colors[effect.hot_color] %}
        {% endif %}
        
        {% for i in range(led_count) %}
            {% set idx = START + i %}
            {% set led_num = i + 1 %}
            {% set transmit = 1 if idx == END else 0 %}
            
            {% if led_num <= lit_count %}
                {% set grad_pos = i / (led_count - 1) if led_count > 1 else 1 %}
                {% set r = (cold_rgb[0] + (hot_rgb[0] - cold_rgb[0]) * grad_pos) * brightness %}
                {% set g = (cold_rgb[1] + (hot_rgb[1] - cold_rgb[1]) * grad_pos) * brightness %}
                {% set b = (cold_rgb[2] + (hot_rgb[2] - cold_rgb[2]) * grad_pos) * brightness %}
                _AURORA_SET_LED LED={LED} INDEX={idx} RED={r} GREEN={g} BLUE={b} TRANSMIT={transmit}
            {% else %}
                {% set r = cold_rgb[0] * brightness * 0.1 %}
                {% set g = cold_rgb[1] * brightness * 0.1 %}
                {% set b = cold_rgb[2] * brightness * 0.1 %}
                _AURORA_SET_LED LED={LED} INDEX={idx} RED={r} GREEN={g} BLUE={b} TRANSMIT={transmit}
            {% endif %}
        {% endfor %}
        
        UPDATE_DELAYED_GCODE ID=_AURORA_THERMAL_LOOP_1 DURATION=1.0
    {% endif %}

