#####################################################################
##                    Aurora Effect: Heartbeat
##
##  Double-pulse pattern like a heartbeat: bump-bump ... pause ...
##
##  Tunable parameters in _AURORA_EFFECT_HEARTBEAT:
##    beat_speed: Heartbeats per second
##    min_brightness: Dimmest point (0.0-1.0)
##    max_brightness: Brightest point (0.0-1.0)
##    color: Color name from _AURORA_COLORS
#####################################################################

[gcode_macro _AURORA_HEARTBEAT_START]
description: Start heartbeat effect on LED range
gcode:
    {% set LED = params.LED|string %}
    {% set START = params.START|int %}
    {% set END = params.END|int %}
    {% set GROUP = params.GROUP|default("?")|string %}
    {% set COLOR = params.COLOR|default("")|string|lower %}
    
    # Store target info
    SET_GCODE_VARIABLE MACRO=_AURORA_HEARTBEAT_STATE VARIABLE=led VALUE='"{LED}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_HEARTBEAT_STATE VARIABLE=start_idx VALUE={START}
    SET_GCODE_VARIABLE MACRO=_AURORA_HEARTBEAT_STATE VARIABLE=end_idx VALUE={END}
    SET_GCODE_VARIABLE MACRO=_AURORA_HEARTBEAT_STATE VARIABLE=group VALUE='"{GROUP}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_HEARTBEAT_STATE VARIABLE=color_override VALUE='"{COLOR}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_HEARTBEAT_STATE VARIABLE=active VALUE=True
    SET_GCODE_VARIABLE MACRO=_AURORA_HEARTBEAT_STATE VARIABLE=phase VALUE=0
    
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=effects_running VALUE=True
    
    UPDATE_DELAYED_GCODE ID=_AURORA_HEARTBEAT_LOOP DURATION=0.1

[gcode_macro _AURORA_HEARTBEAT_STATE]
variable_led: "toolhead_leds"
variable_start_idx: 1
variable_end_idx: 1
variable_group: "?"
variable_color_override: ""
variable_active: False
variable_phase: 0
variable_beat_start: 0
gcode:

[delayed_gcode _AURORA_HEARTBEAT_LOOP]
gcode:
    {% set state = printer["gcode_macro _AURORA_HEARTBEAT_STATE"] %}
    {% set settings = printer["gcode_macro _AURORA_SETTINGS"] %}
    {% set effect = printer["gcode_macro _AURORA_EFFECT_HEARTBEAT"] %}
    {% set colors = printer["gcode_macro _AURORA_COLORS"] %}
    
    {% if state.active %}
        {% set LED = state.led %}
        {% set START = state.start_idx %}
        {% set END = state.end_idx %}
        {% set t = printer.system_stats.cputime %}
        
        # Get effect parameters
        {% set beat_speed = effect.beat_speed %}
        {% set min_b = effect.min_brightness %}
        {% set max_b = effect.max_brightness %}
        # Allow color override via "heartbeat:color" syntax
        {% if state.color_override and state.color_override in colors %}
            {% set color_name = state.color_override %}
        {% else %}
            {% set color_name = effect.color %}
        {% endif %}
        {% set rgb = colors[color_name] %}
        
        # Heartbeat pattern: 2 quick pulses then pause
        # Cycle length adjusted by beat_speed
        {% set cycle_length = 1.0 / beat_speed %}
        {% set cycle = (t % cycle_length) / cycle_length %}
        
        # First beat: 0.0-0.15 of cycle
        # Second beat: 0.2-0.35 of cycle
        # Pause: 0.35-1.0 of cycle
        
        {% if cycle < 0.075 %}
            # First beat up
            {% set wave = cycle / 0.075 %}
        {% elif cycle < 0.15 %}
            # First beat down
            {% set wave = 1.0 - ((cycle - 0.075) / 0.075) %}
        {% elif cycle < 0.2 %}
            # Gap between beats
            {% set wave = 0.0 %}
        {% elif cycle < 0.275 %}
            # Second beat up (slightly smaller)
            {% set wave = 0.7 * ((cycle - 0.2) / 0.075) %}
        {% elif cycle < 0.35 %}
            # Second beat down
            {% set wave = 0.7 * (1.0 - ((cycle - 0.275) / 0.075)) %}
        {% else %}
            # Long pause
            {% set wave = 0.0 %}
        {% endif %}
        
        # Apply brightness range
        {% set brightness = min_b + ((max_b - min_b) * wave) %}
        
        {% set r = rgb[0] * brightness %}
        {% set g = rgb[1] * brightness %}
        {% set b = rgb[2] * brightness %}
        
        # Set LEDs (uses RGBW helper)
        {% for i in range(START, END + 1) %}
            _AURORA_SET_LED LED={LED} INDEX={i} RED={r} GREEN={g} BLUE={b}
        {% endfor %}
        
        UPDATE_DELAYED_GCODE ID=_AURORA_HEARTBEAT_LOOP DURATION={settings.update_rate}
    {% endif %}

[gcode_macro _AURORA_HEARTBEAT_STOP]
gcode:
    SET_GCODE_VARIABLE MACRO=_AURORA_HEARTBEAT_STATE VARIABLE=active VALUE=False
    UPDATE_DELAYED_GCODE ID=_AURORA_HEARTBEAT_LOOP DURATION=0
