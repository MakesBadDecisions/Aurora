#####################################################################
##                    Aurora Effect: Solid
##
##  Static color - no animation.
##  Used directly or as fallback when color name specified.
#####################################################################

[gcode_macro _AURORA_SOLID]
description: Set LEDs to a solid color
gcode:
    {% set LED = params.LED|string %}
    {% set START = params.START|int %}
    {% set END = params.END|int %}
    {% set R = params.R|default(1.0)|float %}
    {% set G = params.G|default(1.0)|float %}
    {% set B = params.B|default(1.0)|float %}
    
    # Set all LEDs in range to the color (uses RGBW helper)
    _AURORA_SET_LED_RANGE LED={LED} START={START} END={END} RED={R} GREEN={G} BLUE={B}
