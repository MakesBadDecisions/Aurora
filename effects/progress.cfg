#####################################################################
##                    Aurora Effect: Progress
##
##  Fill LEDs proportionally to progress (print, bed temp, or extruder temp).
##  LED 1 lights first, then 2, etc. as progress increases.
##
##  Source options (via "progress:source" syntax):
##    progress        - Print progress % (default)
##    progress:bed    - Bed heating progress (current/target)
##    progress:extruder - Extruder heating progress (current/target)
##
##  Tunable parameters in _AURORA_EFFECT_PROGRESS:
##    start_color: Color at 0% (beginning of strip)
##    end_color: Color at 100% (end of strip)
##    background: Color for unlit LEDs (or "off")
##    gradient: 1 = color shifts per LED, 0 = solid end_color
#####################################################################

[gcode_macro _AURORA_PROGRESS_START]
description: Start progress effect on LED range
gcode:
    {% set LED = params.LED|string %}
    {% set START = params.START|int %}
    {% set END = params.END|int %}
    {% set GROUP = params.GROUP|default("?")|string %}
    {% set COLOR = params.COLOR|default("")|string|lower %}
    {% set debug = printer["gcode_macro _AURORA_SETTINGS"].debug %}
    
    # Parse COLOR param - could be a color name OR a source (bed, extruder)
    {% set source = "print" %}
    {% set color_ovr = "" %}
    {% if COLOR in ["bed", "extruder", "hotend"] %}
        {% set source = "bed" if COLOR == "bed" else "extruder" %}
    {% elif COLOR %}
        {% set color_ovr = COLOR %}
    {% endif %}
    
    # Store target info for the loop
    SET_GCODE_VARIABLE MACRO=_AURORA_PROGRESS_STATE VARIABLE=led VALUE='"{LED}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_PROGRESS_STATE VARIABLE=start_idx VALUE={START}
    SET_GCODE_VARIABLE MACRO=_AURORA_PROGRESS_STATE VARIABLE=end_idx VALUE={END}
    SET_GCODE_VARIABLE MACRO=_AURORA_PROGRESS_STATE VARIABLE=group VALUE='"{GROUP}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_PROGRESS_STATE VARIABLE=source VALUE='"{source}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_PROGRESS_STATE VARIABLE=color_override VALUE='"{color_ovr}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_PROGRESS_STATE VARIABLE=active VALUE=True
    
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=effects_running VALUE=True
    
    {% if debug %}
    RESPOND MSG="[AURORA] Progress effect started on {GROUP} (source: {source})"
    {% endif %}
    
    # Start the animation loop
    UPDATE_DELAYED_GCODE ID=_AURORA_PROGRESS_LOOP DURATION=0.1

[gcode_macro _AURORA_PROGRESS_STATE]
description: Progress effect runtime state
variable_led: "chamber_lights"
variable_start_idx: 1
variable_end_idx: 18
variable_group: "?"
variable_source: "print"
variable_color_override: ""
variable_active: False
gcode:

[delayed_gcode _AURORA_PROGRESS_LOOP]
gcode:
    {% set state = printer["gcode_macro _AURORA_PROGRESS_STATE"] %}
    {% set settings = printer["gcode_macro _AURORA_SETTINGS"] %}
    {% set effect = printer["gcode_macro _AURORA_EFFECT_PROGRESS"] %}
    {% set colors = printer["gcode_macro _AURORA_COLORS"] %}
    {% set debug = settings.debug %}
    
    {% if state.active %}
        {% set LED = state.led %}
        {% set START = state.start_idx %}
        {% set END = state.end_idx %}
        {% set led_count = END - START + 1 %}
        {% set source = state.source %}
        {% set temp_floor = settings.temp_floor %}
        
        # Get progress based on source
        {% if source == "bed" %}
            {% set current = printer.heater_bed.temperature|default(0) %}
            {% set target = printer.heater_bed.target|default(0) %}
            {% if target > temp_floor %}
                {% set temp_range = target - temp_floor %}
                {% set progress = (current - temp_floor) / temp_range %}
                {% set progress = [[0.0, progress]|max, 1.0]|min %}
            {% else %}
                {% set progress = 0.0 %}
            {% endif %}
        {% elif source == "extruder" %}
            {% set current = printer.extruder.temperature|default(0) %}
            {% set target = printer.extruder.target|default(0) %}
            {% if target > temp_floor %}
                {% set temp_range = target - temp_floor %}
                {% set progress = (current - temp_floor) / temp_range %}
                {% set progress = [[0.0, progress]|max, 1.0]|min %}
            {% else %}
                {% set progress = 0.0 %}
            {% endif %}
        {% else %}
            # Default: print progress
            {% set progress = printer.display_status.progress|default(0) %}
        {% endif %}
        
        # Calculate how many LEDs should be lit
        {% set lit_count = ((progress * led_count) + 0.5)|int %}
        
        # Get colors - allow override via "progress:color" syntax
        {% set start_rgb = colors[effect.start_color] %}
        {% if state.color_override and state.color_override in colors %}
            {% set end_rgb = colors[state.color_override] %}
        {% else %}
            {% set end_rgb = colors[effect.end_color] %}
        {% endif %}
        {% set bg = effect.background %}
        {% set use_gradient = effect.gradient %}
        
        # Set each LED with TRANSMIT batching
        {% for i in range(led_count) %}
            {% set idx = START + i %}
            {% set led_num = i + 1 %}
            {% set transmit = 1 if idx == END else 0 %}
            
            {% if led_num <= lit_count %}
                # This LED should be lit
                {% if use_gradient and lit_count > 1 %}
                    # Calculate gradient position for this LED (0.0 to 1.0)
                    {% set grad_pos = i / (led_count - 1) if led_count > 1 else 0 %}
                    {% set r = start_rgb[0] + (end_rgb[0] - start_rgb[0]) * grad_pos %}
                    {% set g = start_rgb[1] + (end_rgb[1] - start_rgb[1]) * grad_pos %}
                    {% set b = start_rgb[2] + (end_rgb[2] - start_rgb[2]) * grad_pos %}
                {% else %}
                    # Solid color (use end_color)
                    {% set r = end_rgb[0] %}
                    {% set g = end_rgb[1] %}
                    {% set b = end_rgb[2] %}
                {% endif %}
                _AURORA_SET_LED LED={LED} INDEX={idx} RED={r} GREEN={g} BLUE={b} TRANSMIT={transmit}
            {% else %}
                # This LED should be background/off
                {% if bg == "off" %}
                    _AURORA_SET_LED LED={LED} INDEX={idx} RED=0 GREEN=0 BLUE=0 TRANSMIT={transmit}
                {% else %}
                    {% set bg_rgb = colors[bg] %}
                    _AURORA_SET_LED LED={LED} INDEX={idx} RED={bg_rgb[0]} GREEN={bg_rgb[1]} BLUE={bg_rgb[2]} TRANSMIT={transmit}
                {% endif %}
            {% endif %}
        {% endfor %}
        
        # Update rate depends on source
        {% if source == "print" %}
            UPDATE_DELAYED_GCODE ID=_AURORA_PROGRESS_LOOP DURATION={settings.update_rate_printing}
        {% else %}
            # Temp sources update faster (1 sec like thermal)
            UPDATE_DELAYED_GCODE ID=_AURORA_PROGRESS_LOOP DURATION=1.0
        {% endif %}
    {% endif %}

[gcode_macro _AURORA_PROGRESS_STOP]
description: Stop progress effect
gcode:
    SET_GCODE_VARIABLE MACRO=_AURORA_PROGRESS_STATE VARIABLE=active VALUE=False
    UPDATE_DELAYED_GCODE ID=_AURORA_PROGRESS_LOOP DURATION=0
