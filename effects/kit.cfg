#####################################################################
##                    Aurora Effect: KIT Scanner
##
##  Knight Rider / Cylon style scanner sweep.
##  Sweeps back and forth across the LED strip.
##
##  Tunable parameters in _AURORA_EFFECT_KIT:
##    speed: Sweeps per second
##    tail_length: Number of LEDs in the trail
##    brightness: Max brightness (0.0-1.0)
##    color: Color name from _AURORA_COLORS
#####################################################################

[gcode_macro _AURORA_KIT_START]
description: Start KIT scanner effect
gcode:
    {% set LED = params.LED|string %}
    {% set START = params.START|int %}
    {% set END = params.END|int %}
    {% set GROUP = params.GROUP|default("?")|string %}
    {% set COLOR = params.COLOR|default("")|string|lower %}
    
    SET_GCODE_VARIABLE MACRO=_AURORA_KIT_STATE VARIABLE=led VALUE='"{LED}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_KIT_STATE VARIABLE=start_idx VALUE={START}
    SET_GCODE_VARIABLE MACRO=_AURORA_KIT_STATE VARIABLE=end_idx VALUE={END}
    SET_GCODE_VARIABLE MACRO=_AURORA_KIT_STATE VARIABLE=group VALUE='"{GROUP}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_KIT_STATE VARIABLE=color_override VALUE='"{COLOR}"'
    SET_GCODE_VARIABLE MACRO=_AURORA_KIT_STATE VARIABLE=active VALUE=True
    
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=effects_running VALUE=True
    
    UPDATE_DELAYED_GCODE ID=_AURORA_KIT_LOOP DURATION=0.1

[gcode_macro _AURORA_KIT_STATE]
variable_led: "chamber_lights"
variable_start_idx: 1
variable_end_idx: 18
variable_group: "?"
variable_color_override: ""
variable_active: False
gcode:

[delayed_gcode _AURORA_KIT_LOOP]
gcode:
    {% set state = printer["gcode_macro _AURORA_KIT_STATE"] %}
    {% set settings = printer["gcode_macro _AURORA_SETTINGS"] %}
    {% set effect = printer["gcode_macro _AURORA_EFFECT_KIT"] %}
    {% set colors = printer["gcode_macro _AURORA_COLORS"] %}
    
    {% if state.active %}
        {% set LED = state.led %}
        {% set START = state.start_idx %}
        {% set END = state.end_idx %}
        {% set t = printer.system_stats.cputime %}
        
        # Get effect parameters
        {% set speed = effect.speed %}
        {% set tail = effect.tail_length %}
        {% set max_brightness = effect.brightness %}
        # Allow color override via "kit:color" syntax
        {% if state.color_override and state.color_override in colors %}
            {% set color_name = state.color_override %}
        {% else %}
            {% set color_name = effect.color %}
        {% endif %}
        {% set rgb = colors[color_name] %}
        {% set num_leds = END - START + 1 %}
        
        # Triangle wave for position (0 → 1 → 0)
        {% set wave = ((t * speed) % 2) %}
        {% set moving_right = wave <= 1 %}
        {% if wave > 1 %}
            {% set wave = 2 - wave %}
        {% endif %}
        
        # Current position (float)
        {% set pos = wave * (num_leds - 1) %}
        
        # Set each LED based on distance from position
        # Head = 2 LEDs bright, tail = 3 LEDs trailing behind (direction-aware)
        # Use TRANSMIT=0 to batch updates, TRANSMIT=1 on last LED for atomic update
        {% for i in range(START, END + 1) %}
            {% set led_pos = i - START %}
            {% set offset = led_pos - pos %}
            
            # Tail only trails behind the head (negative offset when moving right, positive when moving left)
            {% if moving_right %}
                {% set is_trailing = offset < 0 %}
                {% set distance = -offset if offset < 0 else offset %}
            {% else %}
                {% set is_trailing = offset > 0 %}
                {% set distance = offset if offset > 0 else -offset %}
            {% endif %}
            
            # Round distance to get discrete LED position from head
            {% set led_dist = distance|round(0, 'floor')|int %}
            
            # Brightness: head LED at full, trailing LEDs dim, forward LEDs off
            {% if led_dist == 0 %}
                {% set brightness = max_brightness %}
            {% elif is_trailing and led_dist == 1 %}
                {% set brightness = max_brightness * 0.85 %}
            {% elif is_trailing and led_dist == 2 %}
                {% set brightness = max_brightness * 0.35 %}
            {% elif is_trailing and led_dist == 3 %}
                {% set brightness = max_brightness * 0.15 %}
            {% elif is_trailing and led_dist == 4 %}
                {% set brightness = max_brightness * 0.05 %}
            {% else %}
                {% set brightness = 0.0 %}
            {% endif %}
            
            {% set r = rgb[0] * brightness %}
            {% set g = rgb[1] * brightness %}
            {% set b = rgb[2] * brightness %}
            
            # TRANSMIT=0 until last LED, then TRANSMIT=1 to send all at once
            {% set transmit = 1 if i == END else 0 %}
            _AURORA_SET_LED LED={LED} INDEX={i} RED={r} GREEN={g} BLUE={b} TRANSMIT={transmit}
        {% endfor %}
        
        UPDATE_DELAYED_GCODE ID=_AURORA_KIT_LOOP DURATION={settings.update_rate}
    {% endif %}

[gcode_macro _AURORA_KIT_STOP]
gcode:
    SET_GCODE_VARIABLE MACRO=_AURORA_KIT_STATE VARIABLE=active VALUE=False
    UPDATE_DELAYED_GCODE ID=_AURORA_KIT_LOOP DURATION=0
