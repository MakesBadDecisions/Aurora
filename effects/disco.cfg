#####################################################################
##                    Aurora Effect: Disco
##
##  Party mode! Random sparkle chaos.
##  Each tick: random LEDs get random colors at random brightness.
##  SUPPORTS MULTIPLE GROUPS - can run on entire printer!
##
##  Tunable parameters in _AURORA_EFFECT_DISCO:
##    change_rate: Seconds between sparkle updates
##    min_sparkle: Minimum LEDs to light per group per tick
##    max_sparkle: Maximum LEDs to light per group per tick
##    brightness: Max brightness cap (0.0-1.0)
#####################################################################

[gcode_macro _AURORA_DISCO_START]
description: Start disco/party effect (supports multiple groups)
gcode:
    {% set LED = params.LED|string %}
    {% set START = params.START|int %}
    {% set END = params.END|int %}
    {% set GROUP = params.GROUP|default("?")|string %}
    {% set state = printer["gcode_macro _AURORA_DISCO_STATE"] %}
    
    # Add this group to the active list
    {% set current_groups = state.groups %}
    {% set group_key = GROUP %}
    
    # Build new group entry
    {% set new_entry = {"led": LED, "start": START, "end": END} %}
    
    # Merge into groups dict (Jinja creates new dict)
    {% set ns = namespace(groups = {}) %}
    {% for k, v in current_groups.items() %}
        {% set _ = ns.groups.update({k: v}) %}
    {% endfor %}
    {% set _ = ns.groups.update({group_key: new_entry}) %}
    
    {% set groups_json = ns.groups|tojson %}
    SET_GCODE_VARIABLE MACRO=_AURORA_DISCO_STATE VARIABLE=groups VALUE='{groups_json}'
    SET_GCODE_VARIABLE MACRO=_AURORA_DISCO_STATE VARIABLE=active VALUE=True
    
    SET_GCODE_VARIABLE MACRO=_AURORA_STATE VARIABLE=effects_running VALUE=True
    
    # Only start loop if not already running
    {% if not state.active %}
        UPDATE_DELAYED_GCODE ID=_AURORA_DISCO_LOOP DURATION=0.1
    {% endif %}

[gcode_macro _AURORA_DISCO_STATE]
variable_groups: {}
variable_active: False
gcode:

[delayed_gcode _AURORA_DISCO_LOOP]
gcode:
    {% set state = printer["gcode_macro _AURORA_DISCO_STATE"] %}
    {% set settings = printer["gcode_macro _AURORA_SETTINGS"] %}
    {% set effect = printer["gcode_macro _AURORA_EFFECT_DISCO"] %}
    {% set colors = printer["gcode_macro _AURORA_COLORS"] %}
    
    {% if state.active and state.groups|length > 0 %}
        {% set max_bright = effect.brightness %}
        {% set min_sparkle = effect.min_sparkle|default(1)|int %}
        {% set max_sparkle = effect.max_sparkle|default(4)|int %}
        
        # Pseudo-random using cputime fractional part
        {% set t = printer.system_stats.cputime %}
        {% set rand_base = ((t * 1000) % 1000) / 1000.0 %}
        
        # Available colors for disco
        {% set color_list = ["red", "green", "blue", "orange", "purple", "cyan", "pink", "yellow", "lava", "lime", "magenta"] %}
        
        # Process each registered group
        {% set group_idx = namespace(val=0) %}
        {% for group_name, group_info in state.groups.items() %}
            {% set LED = group_info.led %}
            {% set START = group_info.start %}
            {% set END = group_info.end %}
            {% set num_leds = END - START + 1 %}
            
            # Offset randomness per group so they don't sync
            {% set group_rand = ((rand_base + (group_idx.val * 0.37)) % 1.0) %}
            {% set group_idx.val = group_idx.val + 1 %}
            
            # First, dim all LEDs in this group
            {% for i in range(START, END + 1) %}
                {% set transmit = 1 if i == END else 0 %}
                _AURORA_SET_LED LED={LED} INDEX={i} RED=0 GREEN=0 BLUE=0 TRANSMIT={transmit}
            {% endfor %}
            
            # How many LEDs to sparkle this tick (scales with LED count)
            {% set max_for_group = [max_sparkle, num_leds]|min %}
            {% set min_for_group = [min_sparkle, max_for_group]|min %}
            {% set sparkle_count = (((group_rand * 17) % (max_for_group - min_for_group + 1)) + min_for_group)|int %}
            
            # Light up random LEDs with random colors and brightness
            {% for s in range(sparkle_count) %}
                # Pick a random LED index
                {% set led_offset = (((group_rand * (s + 1) * 31) % 1.0) * num_leds)|int %}
                {% set led_idx = START + led_offset %}
                
                # Pick a random color
                {% set color_pick = (((group_rand * (s + 2) * 47) % 1.0) * (color_list|length))|int %}
                {% set rgb = colors[color_list[color_pick]] %}
                
                # Random brightness (0.3 to max)
                {% set bright = 0.3 + (((group_rand * (s + 3) * 73) % 1.0) * (max_bright - 0.3)) %}
                
                {% set r = rgb[0] * bright %}
                {% set g = rgb[1] * bright %}
                {% set b = rgb[2] * bright %}
                
                _AURORA_SET_LED LED={LED} INDEX={led_idx} RED={r} GREEN={g} BLUE={b} TRANSMIT=1
            {% endfor %}
        {% endfor %}
        
        UPDATE_DELAYED_GCODE ID=_AURORA_DISCO_LOOP DURATION={effect.change_rate}
    {% endif %}

[gcode_macro _AURORA_DISCO_STOP]
gcode:
    {% set empty = {} %}
    SET_GCODE_VARIABLE MACRO=_AURORA_DISCO_STATE VARIABLE=groups VALUE='{empty|tojson}'
    SET_GCODE_VARIABLE MACRO=_AURORA_DISCO_STATE VARIABLE=active VALUE=False
    UPDATE_DELAYED_GCODE ID=_AURORA_DISCO_LOOP DURATION=0
